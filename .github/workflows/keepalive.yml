name: Render keep-alive

on:
  schedule:
    # Every 10 minutes Mon-Fri, 9:00 AM – 5:00 PM ET (13:00–21:00 UTC)
    - cron: "*/10 13-21 * * 1-5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            https://options-system-2u59.onrender.com/health)
          echo "Health check returned HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: app returned $STATUS — may be restarting"
          fi
