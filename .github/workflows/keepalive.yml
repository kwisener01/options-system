name: keepalive

# Backup wake-pinger for the Render free-tier app, so the APScheduler jobs
# (scans, auto-trade, and especially the auto-EXIT) never miss because the
# instance fell asleep. UptimeRobot is the primary pinger; this is redundancy.
#
# Runs every 10 min on weekdays across the US market session in both EST and EDT
# (cron is UTC; market 09:30-16:00 ET = 13:30-21:00 UTC depending on DST).
# Scheduled runs can be delayed by GitHub under load — fine for a backup.

on:
  schedule:
    - cron: "*/10 13-21 * * 1-5"
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake /health (retry to cover cold start)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
              https://options-system-2u59.onrender.com/health || echo 000)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "health not 200 after retries (backup pinger — not failing the job)"
